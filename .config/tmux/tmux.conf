# Send prefix
 unbind-key C-b
 set-option -g prefix C-q
 bind-key C-q send-prefix

# vim-like split-window
 bind -n M-s split-window
 bind -n M-v split-window -h
 bind -n M-t split-window -l 15

# vim-like pane switching
 bind -n M-h select-pane -L
 bind -n M-l select-pane -R
 bind -n M-k select-pane -U
 bind -n M-j select-pane -D
 bind -n M-h select-pane -L
 bind -n M-l select-pane -R
 bind -n M-k select-pane -U
 bind -n M-j select-pane -D
 bind -n M-space next-layout
 bind -n M-Enter swap-pane -U
 bind -n M-x kill-pane
 bind -n M-H resize-pane -L 5
 bind -n M-L resize-pane -R 5
 bind -n M-K resize-pane -U 5
 bind -n M-J resize-pane -D 5
 bind -n M-z resize-pane -Z

# wm-like window management
 bind -n M-o new-window -c '#{pane_current_path}'
 bind -n M-p previous-window
 bind -n M-n next-window
 bind -n M-X kill-window
 bind -n M-1 select-window -t :=1
 bind -n M-2 select-window -t :=2
 bind -n M-3 select-window -t :=3
 bind -n M-4 select-window -t :=4
 bind -n M-5 select-window -t :=5
 bind -n M-6 select-window -t :=6
 bind -n M-7 select-window -t :=7
 bind -n M-8 select-window -t :=8
 bind -n M-9 select-window -t :=9
 bind -n M-i command-prompt 'rename-window %%'

# hide status bar
set-option -g status off
bind -n M-b set-option -g status

# scrollback/copy-mode
 bind -n M-[ copy-mode
 bind -n M-] paste-buffer

# Mouse mode
 setw -g mouse on

# Easy config reload
bind-key -n M-r source-file ~/.config/tmux/tmux.conf \; display-message "~/.config/tmux/tmux.conf reloaded."

# tmux command
 bind -n M-: command-prompt

# Automatically copy anything i select to the clipboard
 setw -g mode-keys vi

 # vim visual mode: v charwise, V linewise (default), C-v blockwise
 bind -T copy-mode-vi v send-keys -X begin-selection
 bind -T copy-mode-vi C-v send-keys -X begin-selection \; send-keys -X rectangle-toggle

 # y yanks to system clipboard, Escape backs out like vim
 bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -i -f -selection primary | xclip -i -selection clipboard"
 bind -T copy-mode-vi Y send-keys -X copy-pipe-end-of-line-and-cancel "xclip -i -f -selection primary | xclip -i -selection clipboard"
 bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -i -f -selection primary | xclip -i -selection clipboard"
 bind -T copy-mode-vi Escape send-keys -X cancel
 bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"

# Pass Shift+Tab through to applications (e.g. Claude Code plan mode)
 unbind -n BTab
 bind -n M-Tab send-keys BTab

# Escape time for neovim
set-option -sg escape-time 10

# focus-events so autoread can work in neovim
set-option -g focus-events on

# Defaul shell
# Read the login shell from /etc/passwd (fish on both Arch, /usr/bin/fish, and
# NixOS, /run/current-system/sw/bin/fish) instead of hardcoding either path.
# Leaving default-shell unset is not enough: tmux prefers $SHELL from the
# environment that started the server, and that can be /bin/sh.
run-shell 'tmux set -g default-shell "$(getent passwd "$(id -un)" | cut -d: -f7)"'

# Allow notification passthrough
set -g allow-passthrough on

######################
### DESIGN CHANGES ###
######################
# Starting counting panes and windows from 1
set -g default-terminal screen-256color
set -g base-index 1
setw -g pane-base-index 1

# panes
set -g pane-border-style 'fg=colour249'
set -g pane-active-border-style 'fg=#8be9fd'

# statusbar
set -g status-position bottom
set -g status-justify centre
set -g status-style bg=default
set -g status-left '#[fg=color249 bold] #S #[fg=color249 bold]  '
set -g status-right "#[fg=color249 bold] #[bg=default] %a %d %R"
set -g status-right-length 50
set -g status-left-length 20
setw -g window-status-current-style 'fg=#f8f8f2 bg=default bold'
setw -g window-status-current-format ' #I#[fg=#f8f8f2]: #W#[fg=colour249] '
setw -g window-status-style 'fg=colour249 bold bg=default'
setw -g window-status-format ' #I#[fg=colour249 bold]: #W#[fg=colour249 bold] '

# Hide terminal (AI workflow)
bind -n M-y run-shell "~/.config/tmux/toggle-terminal.sh"

######################
### PLUGINS (TPM)  ###
######################
# tmux-agent-status: AI agent (Claude Code) session monitor.
# Sidebar + fzf switcher + status-line glyphs, driven by Claude Code hooks
# in ~/.claude/settings.json (hooks/better-hook.sh).
#
# prefix (C-q) + S  hierarchical fzf switcher
# prefix (C-q) + o  focus/create the sidebar
# prefix (C-q) + N  jump to next inbox item (done/ask)
# prefix (C-q) + W  timed wait mode
# prefix (C-q) + p  park session/pane
#
# Note: the status-line summary only shows while the status bar is visible
# (M-b toggles it; `set -g status off` above keeps it hidden by default).
set -g @agent-switcher-style "both"          # popup | sidebar | both
set -g @agent-switcher-default-mode "tree"   # tree | agents (ctrl-f toggles)
set -g @agent-status-display-method "popup"  # popup | window
set -g @agent-sidebar-width "42"
set -g @agent-notification-sound "chime"     # chime | bell | fanfare | frog | speech | none

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'samleeney/tmux-agent-status'

# Keep this as the last line of the file.
run '~/.config/tmux/plugins/tpm/tpm'
