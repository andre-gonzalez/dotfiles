session_name: pessoal
windows:
  - window_name: pessoal
    layout: main-horizontal
    panes:
      - shell_command: clear  # top-left: editor
      - shell_command: clear && ls # bottom-left: terminal
  - window_name: notas
    layout: main-horizontal
    shell_command_before:
      - cd ~/projects/notas/ # run as a first command in all panes
    panes:
      - shell_command:
        - "nvim ~/projects/notas/pessoal/to-dos/meus-personal-to-dos.md" # run as a first command in all panes
  - window_name: newsboat
    panes:
      - newsboat
  # - window_name: spotify
  #   panes:
  #     - spotify_player
