fading = false;
fade-delta = 0;             # (older picom versions)
fade-in-step = 1.0;         # instantly appear
fade-out-step = 1.0;        # instantly disappear
no-fading-openclose = true; # prevents any open/close fading

backend = "glx";

shadow = true;
shadow-radius = 12;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-opacity = 0.25;

# Blur strength/method are global — picom has no per-window radius.
blur-method = "dual_kawase";
blur-strength = 6;
blur-background = true;

# Window rules. NOTE: defining `rules` disables ALL legacy matchers
# (opacity-rule, shadow-exclude, blur-background-exclude, focus-exclude),
# so everything lives here now.
rules = (
  # was: opacity-rule 90:...
  { match = "class_g = 'Chromium-browser' || class_g = 'Google-chrome' || "
            "class_g = 'Chromium' || class_g = 'Chrome'"; opacity = 0.9; },

  # was: shadow-exclude
  { match = "class_g = 'dwm' || class_g = 'st-256color'"; shadow = false; },

  # was: blur-background-exclude
  { match = "class_g = 'Dmenu' || window_type = 'dock' || window_type = 'desktop'";
    blur-background = false; },

  # weak blur on the dwm bar: full-strength kernel, blended at 40%
  { match = "class_g = 'dwm'"; blur-background = true; blur-opacity = 0.4; },

  # keep st readable on light wallpapers: raise its background alpha
  { match = "class_g = 'st-256color'";
    shader = "/home/frank/.config/picom/st-readable.glsl"; },

  # `rules` no longer auto-disables rounded corners on fullscreen windows
  { match = "fullscreen"; corner-radius = 0; },
);
